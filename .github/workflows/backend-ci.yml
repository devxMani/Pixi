name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "index.html"
      - "console.html"
      - "scripts/check_prototype.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "index.html"
      - "console.html"
      - "scripts/check_prototype.py"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Check database migration upgrade, downgrade, and re-upgrade
        run: |
          export DATABASE_URL=sqlite:///./pixi_migration_ci.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Check prototype and workspace JavaScript syntax
        run: python ../scripts/check_prototype.py
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check app tests
